server.port=8085

spring.application.name=auth-service

spring.config.import=classpath:application-common.properties

spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authdb}

security.jwt.secret=${JWT_SECRET:change-this-local-secret-change-this-local-secret}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
security.resource-server.enabled=false

auth.seed.enabled=${AUTH_SEED_ENABLED:true}
auth.seed.admin.username=${AUTH_ADMIN_USERNAME:admin}
auth.seed.admin.password=${AUTH_ADMIN_PASSWORD:admin123}
auth.seed.user.username=${AUTH_USER_USERNAME:user}
auth.seed.user.password=${AUTH_USER_PASSWORD:user123}
